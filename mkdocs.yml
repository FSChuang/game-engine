site_name: Game Engine
site_description: >-
  A lightweight C++17 / SDL3 engine built around explicit ownership,
  deterministic timing, and simple multiplayer networking.
site_url: https://fschuang.github.io/game-engine/
repo_url: https://github.com/FSChuang/game-engine
repo_name: FSChuang/game-engine
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Build & Run: getting-started/build-and-run.md
  - Concepts:
      - Application Loop: concepts/application-loop.md
      - Logical Time: concepts/logical-time.md
  - Systems:
      - Application: systems/application.md
      - Time: systems/time.md
  - Guides:
      - Pause & Slow Motion: guides/pause-and-slow-motion.md
  - API Reference:
      - Application: reference/application.md
      - Timeline: reference/timeline.md
  - Architecture:
      - Overview: architecture/overview.md
      - Application Lifecycle: architecture/application-lifecycle.md
      - Timeline Ownership & Sampling: architecture/timeline-ownership-and-sampling.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
