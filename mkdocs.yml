site_name: Game Engine
site_description: >-
  A lightweight C++17 / SDL3 engine built around explicit ownership,
  deterministic timing, and simple multiplayer networking.
site_url: https://fschuang.github.io/game-engine/
repo_url: https://github.com/FSChuang/game-engine
repo_name: FSChuang/game-engine
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Build & Run: getting-started/build-and-run.md
  - Concepts:
      - Application Loop: concepts/application-loop.md
      - Logical Time: concepts/logical-time.md
      - Rendering & Scaling: concepts/rendering-and-scaling.md
      - Entity Model: concepts/entity-model.md
      - Input State: concepts/input-state.md
      - Networking Model: concepts/networking-model.md
  - Systems:
      - Application: systems/application.md
      - Renderer: systems/renderer.md
      - Entity: systems/entity.md
      - Physics: systems/physics.md
      - Input: systems/input.md
      - Collision: systems/collision.md
      - Time: systems/time.md
      - Networking:
          - Overview: systems/networking/index.md
          - Protocol: systems/networking/protocol.md
          - Socket: systems/networking/socket.md
          - Server Dispatch: systems/networking/server-dispatch.md
  - Guides:
      - Pause & Slow Motion: guides/pause-and-slow-motion.md
      - Toggle Scaling Mode: guides/toggle-scaling-mode.md
      - Configure Gravity: guides/configure-gravity.md
      - Send a Request: guides/send-a-request.md
  - API Reference:
      - Application: reference/application.md
      - Renderer: reference/renderer.md
      - Entity: reference/entity.md
      - PhysicsSystem: reference/physics-system.md
      - InputManager: reference/input-manager.md
      - Collision: reference/collision.md
      - Timeline: reference/timeline.md
      - Protocol: reference/protocol.md
      - Socket: reference/socket.md
      - PlayerRegistry & ServerDispatch: reference/player-registry-and-server-dispatch.md
  - Architecture:
      - Overview: architecture/overview.md
      - Application Lifecycle: architecture/application-lifecycle.md
      - Timeline Ownership & Sampling: architecture/timeline-ownership-and-sampling.md
      - Networking Threading Model: architecture/networking-threading-model.md
  - Examples:
      - Spare Parts: examples/spare-parts.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Generated API fragments (Documentation Phase 4 pilot) live outside docs_dir
      # entirely -- see scripts/generate_api_docs.py and Doxyfile. check_paths
      # makes a missing/not-yet-generated fragment fail the build loudly instead
      # of silently rendering an empty gap.
      base_path:
        - .docs-build/api-fragments
      check_paths: true
  - toc:
      permalink: true
