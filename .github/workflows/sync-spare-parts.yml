name: Sync Engine to Spare Parts

on:
  push:
    branches: [main]
    paths:
      - 'Engine/**'

jobs:
  notify-spare-parts:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch engine-updated event to FSChuang/spare-parts
        env:
          GH_TOKEN: ${{ secrets.SPARE_PARTS_SYNC_TOKEN }}
        run: |
          gh api repos/FSChuang/spare-parts/dispatches \
            -f event_type=engine-updated
